# Include inside the HTTPS server block for ultimaotserv.online.
# The frontend is deployed to /home/penultima/ultima-myaac/beats-monitor.

location = /beats-monitor {
    return 301 /beats-monitor/;
}

location /beats-monitor/ {
    alias /home/penultima/ultima-myaac/beats-monitor/;
    try_files $uri $uri/ /beats-monitor/index.html;
}

location /beats-monitor-api/ws {
    proxy_pass http://127.0.0.1:51842/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
}

location /beats-monitor-api/ {
    proxy_pass http://127.0.0.1:51842/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
